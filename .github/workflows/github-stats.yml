name: Update GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # Checkout Repository
      # =========================

      - name: Checkout repository
        uses: actions/checkout@v5

      # =========================
      # GitHub Stats
      # =========================

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&bg_color=0d1117&title_color=a78bfa&icon_color=8b5cf6&text_color=c9d1d9&hide_border=true&rank_icon=github
          path: assets/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # =========================
      # Top Languages
      # =========================

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&bg_color=0d1117&title_color=a78bfa&text_color=c9d1d9&hide_border=true
          path: assets/top-languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # =========================
      # GitHub Streak
      # =========================

      - name: Generate GitHub Streak
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=dark&background=0d1117&stroke=312e81&ring=8b5cf6&fire=a78bfa&currStreakLabel=a78bfa&sideLabels=c9d1d9&currStreakNum=ffffff&sideNums=ffffff&dates=6b7280&hide_border=true&disable_animations=true
          path: assets/github-streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # =========================
      # Contribution Activity Graph
      # =========================

      - name: Generate Contribution Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: bg_color=0d1117&color=9ca3af&line=8b5cf6&point=c4b5fd&area_color=312e81&area=true&hide_border=true&custom_title=Manik's%20Contribution%20Activity
          output_path: assets/contribution-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # =========================
      # Commit Generated Files
      # =========================

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/*.svg

          git diff --cached --quiet || git commit -m "Update GitHub stats"

          git push
